<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202515">
    <meta name="description" content="Money Meadow is a living impossible garden where flowers, coins, and paper currency grow together.">
    <link rel="preload" href="./assets/images/garden-v6.png" as="image" fetchpriority="high">
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/main.js"></script>
    <title>Money Meadow</title>
  </head>
  <body>
    <main class="meadow" aria-labelledby="title" aria-describedby="scene-description">
      <h1 id="title" class="title">Money Meadow</h1>
      <p id="scene-description" class="sr-only">A vivid flower garden surrounds a winding path covered in coins. Paper currency is tucked among dense blossoms and foliage. Parts of the garden move occasionally and independently.</p>

      <div class="image-stage" aria-hidden="true">
        <img class="garden-base" src="./assets/images/garden-v6.png" alt="" width="1672" height="941" fetchpriority="high">

        <div class="motion-patch patch-roses layer-foreground" data-patch="roses"><div class="patch-image"></div></div>
        <div class="motion-patch patch-hollyhocks layer-middle" data-patch="hollyhocks"><div class="patch-image"></div></div>
        <div class="motion-patch patch-hydrangeas layer-middle" data-patch="hydrangeas"><div class="patch-image"></div></div>
        <div class="motion-patch patch-lupines layer-background" data-patch="lupines"><div class="patch-image"></div></div>
        <div class="motion-patch patch-coneflowers layer-middle" data-patch="coneflowers"><div class="patch-image"></div></div>
        <div class="motion-patch patch-tulips layer-foreground" data-patch="tulips"><div class="patch-image"></div></div>
        <div class="motion-patch patch-marigolds layer-foreground" data-patch="marigolds"><div class="patch-image"></div></div>
        <div class="motion-patch patch-peonies layer-foreground" data-patch="peonies"><div class="patch-image"></div></div>

        <div class="motion-patch patch-bill-high layer-middle" data-patch="bill-high"><div class="patch-image"></div></div>
        <div class="motion-patch patch-bill-middle layer-middle" data-patch="bill-middle"><div class="patch-image"></div></div>
        <div class="motion-patch patch-bill-low layer-middle" data-patch="bill-low"><div class="patch-image"></div></div>

        <div class="coin-glint coin-glint-path-high" data-glint="path-high"></div>
        <div class="coin-glint coin-glint-path-low" data-glint="path-low"></div>
        <div class="coin-glint coin-glint-large" data-glint="large"></div>
        <div class="coin-glint coin-glint-bank" data-glint="bank"></div>

        <div class="ambient-event butterfly" data-event="butterfly"><i></i><i></i></div>
        <div class="ambient-event drifting-seed" data-event="seed"><i></i><i></i><i></i></div>
        <div class="ambient-event falling-leaf" data-event="leaf"></div>
        <div class="ambient-event distant-insect" data-event="insect"></div>

        <div class="hotspot-layer"></div>
      </div>

      <div class="edge-shade" aria-hidden="true"></div>
    </main>
  </body>
</html>
